y"],"note":""}]},{"name":"内政与城市人事","actions":[{"id":"action-8","name":"委任内政负责人","steps":["筹划阶段","己方城市“委任”","选择内政方向","比较本城人选","选择并确认；城市详情“管理”","展开“城市科技”","节点“详情”查看效果和前置"],"images":["domestic","domestic-landscape","direction","appointment","appointment-selected","technology-details","technology-details-mobile"],"note":"技术方向使用智力。进阶科技需要同城两名真实技术负责人、多种设施及治安；详情列出缺少条件。金粮兵基础科技增产20%，对应进阶累计50%；军需法减费25%，省工法建设减费20%。研究目标由负责人自动选择，同城同时一项；已付研究中断后保留进度，接续不重复收费。"},{"id":"action-9","name":"改任内政方向","steps":["目标方向","选符合资格的现任人员","确认","必要时选立即执行／办完执行"],"images":["direction","appointment","timing"],"note":""},{"id":"action-10","name":"解除内政","steps":["方向内现任负责人","解除","若有事务，选择执行时机"],"images":["direction-assigned","timing"],"note":""},{"id":"action-11","name":"任命或更换太守","steps":["筹划阶段","点击己方城市","人事","太守","比较政治、任职特性与当前事务","选择一名本城合法武将","确认"],"images":["governor-entry","governor","governor-assigned"],"note":"任命不会自动开启太守审批；更换人选会收回原审批委托。选人页可点“指引”或按 F1 查看操作。"},{"id":"action-12","name":"解除太守","steps":["点击己方城市","详情","管理","展开太守","解除"],"images":["governor-assigned","governor-removed"],"note":"解除任命同时收回该城太守审批委托；不解除其他内政职务。"},{"id":"action-13","name":"调整全势力内政优先级","steps":["内政","委任优先级","方向右侧上移或下移"],"images":["affairs"],"note":"每次调整即保存本势力顺序；关闭不回滚；首位不能上移，末位不能下移。"},{"id":"action-14","name":"补齐全势力委任","steps":["内政","查看委任优先级","表头统一委任"],"images":["affairs"],"note":"按当前优先级使用真实合法人选，反馈实际补齐数量。"},{"id":"action-15","name":"同意一项内政提案","steps":["旬初筹划","点击进行","统一提出提案","主界面内政","提案","查看人员、地点、费用、耗时和资源缺口","调整本城预算或安排","同意"],"images":["proposals","proposals-approved"],"note":""},{"id":"action-16","name":"暂缓提案","steps":["旬初提案","可按提案类型筛选","逐项暂缓，或核阅后暂缓本页"],"images":["proposals"],"note":""},{"id":"action-17","name":"同意本页提案","steps":["旬初提案","可按提案类型筛选","核阅当前显示的事项与费用合计","同意本页"],"images":["proposals","proposals-approved"],"note":""},{"id":"action-18","name":"委托太守审批","steps":["先从城市人事任命太守","主界面内政","城市审批","找到本城","开启太守审批"],"images":["governor-delegation","governor-delegated"],"note":"任命与审批委托分开。再次关闭可收回委托；更换、解除、离城或易主后须重新委托。太守按本城实际资源代批或缓办，汇报收支及异常；未委托 function renderNav(){
 const list=all.filter(matches);$('match-count').textContent=query?list.length+' 项':'';$('clear-search').hidden=!query;
 $('navigation').innerHTML=manual.chapters.map((c,i)=>{const rows=list.filter(a=>a.chapter===c.name);return !rows.length?'':`<details ${query||active().chapterIndex===i?'open':''}><summary>${esc(c.name)}<small>${rows.length}</small></summary>${rows.map(a=>`<button class="nav-action" data-id="${a.id}" ${a.id===selected?'aria-current="page"':''}>${esc(a.name)}${syncById.get(a.id).pending?'<span class="nav-pending">待核对</span>':''}</button>`).join('')}</details>`;}).join('')||'<p class="nav-empty">没有找到操作。试试“出征”或“存档”。</p>';
 $('mobile-select').innerHTML=list.length?manual.chapters.map(c=>{const rows=list.filter(a=>a.chapter===c.name);return rows.length?`<optgroup label="${esc(c.name)}">${rows.map(a=>`<option value="${a.id}" ${a.id===selected?'selected':''}>${esc(a.name)}</option>`).join('')}</optgroup>`:'';}).join(''):'<option>没有匹配的操作</option>';
}
function renderAction(){
 const a=active(),list=all.filter(matches),position=list.findIndex(x=>x.id===selected),sync=syncById.get(a.id);
 $('sync-current').innerHTML=`<p>${esc(a.name)} · ${sync.pending?'待核对步骤与截图':'已核对'}${sync.reviewedAt?' · '+esc(sync.reviewedAt.slice(0,10)):''}</p>${sync.changes.length?`<p>变化文件：<code>${esc(sync.changes.join('、'))}</code></p>`:''}<details><summary>关联代码与重拍入口</summary><p>公共或未分类的运行代码变动按全册复核。</p><div class="sync-source">${sync.sources.map(path=>`<a href="../${esc(path)}">${esc(path)}</a>`).join('')}</div><p>${sync.captureGroups.map(group=>`<code>node scripts/capture-action-guide.mjs ${esc(group)}</code>`).join('<br>')}</p></details>`;
 if(query&&!list.length){$('action-content').innerHTML='<p class="empty-main">没有匹配的操作</p>';$('capture-meta').textContent='';return;}
 $('action-content').innerHTML=`<div class="crumb">${esc(a.chapter)}</div><div class="title-row"><h1>${esc(a.name)}</h1><span class="counter">${all.indexOf(a)+1} / ${all.length}</span></div>${sync.pending?'<p class="note sync-warning">此操作的步骤与截图待核对。</p>':''}<ol class="steps">${a.steps.map(step=>`<li>${esc(step)}</li>`).join('')}</ol>${a.note?`<p class="note">${esc(a.note)}</p>`:''}<figure class="figure"><button class="image-button" id="open-image" aria-label="放大截图"><img id="main-image" alt="" decoding="async"></button><figcaption><span id="image-caption"></span><small>点击放大 · ← → 切换截图</small></figcaption></figure><div class="shots" aria-label="关键步骤截图">${a.images.map((id,i)=>`<button class="shot" data-shot="${i}" aria-pressed="${i===shotIndex}" aria-label="截图 ${i+1}：${esc(manual.captures[id].title)}"><img src="${esc(manual.captures[id].file)}" alt="" loading="lazy"><span>${i+1}. ${esc(manual.captures[id].title)}</span></button>`).join('')}</div><div class="flow-nav"><button data-flow="-1" ${position<=0?'disabled':''}>← ${position>0?esc(list[position-1].name):'第一项'}</button><button data-flow="1" ${position<0||position===list.length-1?'disabled':''}>${position>=0&&position<list.length-1?esc(list[position+1].name):'最后一项'} →</button></div>`;
 renderShot();
}
function renderShot(){const s=shot();$('main-image').src=s.file;$('main-image').alt=s.title;$('image-caption').textContent=(shotIndex+1)+' / '+active().images.length+' · '+s.title;document.querySelectorAll('[data-shot]').forEach(el=>el.setAttribute('aria-pressed',String(Number(el.dataset.shot)===shotIndex)));$('capture-meta').textContent=s.sample+'；'+s.viewport.width+' × '+s.viewport.height+'；截图日期 '+s.capturedAt.slice(0,10)+'。';}
function choose(id,focus=false){if(!byId.has(id))return;selected=id;shotIndex=0;history.replaceState(null,'','#'+id);renderNav();renderAction();if(focus){$('content').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}}
document.addEventListener('click',e=>{const target=e.target.closest('button');if(!target)return;if(target.dataset.id)choose(target.dataset.id,true);if(target.dataset.shot!==undefined){shotIndex=Number(target.dataset.shot);renderShot();}if(target.dataset.flow){const list=all.filter(matches),i=list.findIndex(a=>a.id===selected)+Number(target.dataset.flow);if(list[i])choose(list[i].id,true);}if(target.id==='open-image'){const s=shot();$('zoom-image').src=s.file;$('zoom-image').alt=s.title;$('zoom-title').textContent=s.title;$('zoom-body').classList.remove('original');$('zoom-size').textContent='原始尺寸';$('lightbox').showModal();}if(target.id==='zoom-close')$('lightbox').close();if(target.id==='zoom-size'){$('zoom-body').classList.toggle('original');target.textContent=$('zoom-body').classList.contains('original')?'适合窗口':'原始尺寸';}});
$('search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();const list=all.filter(matches);if(list.length&&!list.some(a=>a.id===selected)){selected=list[0].id;shotIndex=0;}renderNav();renderAction();});
$('clear-search').addEventListener('click',()=>{$('search').value='';$('search').dispatchEvent(new Event('input'));$('search').focus();});
$('mobile-select').addEventListener('change',e=>choose(e.target.value,true));
window.addEventListener('hashchange',()=>choose(location.hash.slice(1)));
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)||$('lightbox').open||!$('main-image'))return;if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();shotIndex=(shotIndex+(e.key==='ArrowRight'?1:-1)+active().images.length)%active().images.length;renderShot();}});
$('lightbox').addEventListener('click',e=>{if(e.target===$('lightbox'))$('lightbox').close();});
renderNav();renderAction();
</script>
</html>
