<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>三国 · 操作手册</title>
<style>
:root{color-scheme:light;--paper:#f4f1e9;--ink:#28382f;--muted:#677068;--line:#dadbcf;--red:#9e402d;--panel:#fffef9}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 "Microsoft YaHei","PingFang SC",system-ui,sans-serif}button,input,select{font:inherit}button,a,input,select,summary{-webkit-tap-highlight-color:transparent}button,summary{cursor:pointer}button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ad633c;outline-offset:3px}button{color:inherit}a{color:var(--red)}[hidden]{display:none!important}.top{min-height:82px;background:#253a32;color:#f7f1df;display:flex;align-items:center;gap:24px;padding:15px 30px;border-bottom:3px solid #b18b50}.brand{flex-shrink:0;font-size:21px;letter-spacing:3px;font-weight:700}.brand small{display:block;font-size:11px;letter-spacing:1px;font-weight:400;color:#c1cbbb}.search{margin-left:auto;position:relative;width:min(430px,50vw)}.search input{width:100%;border:1px solid #829183;border-radius:7px;background:#faf9f1;color:#26372c;padding:11px 42px 11px 14px}.search button{position:absolute;right:7px;top:7px;border:0;background:transparent;font-size:20px;width:32px;height:32px}.workspace{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1680px;margin:auto}.sidebar{height:calc(100dvh - 85px);position:sticky;top:0;padding:20px 14px 30px 22px;overflow:auto;border-right:1px solid var(--line);scrollbar-width:thin}.nav-heading{display:flex;justify-content:space-between;padding:0 9px 13px;font-size:12px;color:var(--muted)}.sidebar details{border-top:1px solid var(--line);padding:5px 0}.sidebar summary{display:flex;align-items:center;gap:8px;list-style:none;font-size:14px;font-weight:700;padding:9px}.sidebar summary:before{content:'›';transition:transform .15s;font-size:19px;line-height:1}.sidebar details[open]>summary:before{transform:rotate(90deg)}.sidebar summary small{margin-left:auto;font-weight:400;color:var(--muted)}.nav-action{display:block;width:100%;border:0;background:transparent;text-align:left;padding:8px 10px 8px 26px;border-radius:5px;font-size:13px;line-height:1.55}.nav-action:hover{background:#e8e8dc}.nav-action[aria-current="page"]{background:#dde5da;color:#213e31;box-shadow:inset 3px 0 #9e402d;font-weight:700}.nav-empty{padding:14px;font-size:14px;color:var(--muted)}main{min-width:0;padding:29px 32px 40px}.crumb{font-size:12px;color:var(--muted);letter-spacing:1px;margin-bottom:7px}.title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}h1{font-size:27px;font-weight:650;margin:0 0 19px;line-height:1.35;letter-spacing:1px}.counter{white-space:nowrap;color:var(--muted);font-size:12px;margin-top:6px}.steps{list-style:none;counter-reset:steps;display:flex;flex-wrap:wrap;gap:9px 20px;padding:0;margin:0 0 17px}.steps li{counter-increment:steps;display:flex;align-items:baseline;gap:8px;max-width:100%;font-size:14px}.steps li:before{content:counter(steps);flex-shrink:0;font-size:11px;font-weight:700;display:inline-grid;place-content:center;color:#faf9ed;background:#3f5847;border-radius:50%;width:21px;height:21px}.note{font-size:13px;color:#7c4d32;border-left:3px solid #bb9060;padding:5px 12px;margin:0 0 18px;background:#ede6d7}.figure{margin:0;border:1px solid #aab3a6;border-radius:8px;overflow:hidden;background:#27342d;box-shadow:0 9px 24px #23352212}.image-button{display:block;border:0;background:transparent;width:100%;padding:0;cursor:zoom-in}.image-button img{display:block;width:100%;height:auto;max-height:63vh;object-fit:contain}.figure figcaption{display:flex;align-items:center;justify-content:space-between;gap:16px;background:#fffef9;color:#3b4b3d;padding:10px 16px;min-height:46px;font-size:13px}.figure figcaption small{font-size:11px;color:var(--muted);white-space:nowrap}.shots{display:flex;gap:9px;overflow-x:auto;padding:12px 1px 14px;scrollbar-width:thin}.shot{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:4px;flex:0 0 140px;text-align:left}.shot[aria-pressed="true"]{border:2px solid var(--red);padding:3px}.shot img{display:block;width:130px;height:78px;object-fit:contain;background:#2d3a31;border-radius:2px}.shot span{display:block;line-height:1.5;font-size:11px;padding:4px 3px 2px;max-height:39px;overflow:hidden}.flow-nav{display:flex;justify-content:space-between;gap:16px;padding:16px 0 9px;border-top:1px solid var(--line)}.flow-nav button{background:var(--panel);border:1px solid var(--line);padding:9px 15px;border-radius:5px;font-size:13px;max-width:48%;text-align:left}.flow-nav button:last-child{text-align:right}.flow-nav button:disabled{opacity:.4;cursor:default}.about{margin-top:20px;color:var(--muted);font-size:12px}.about summary{width:max-content}.about p{max-width:850px;margin:8px 0}.about code{font-size:11px}.mobile-nav{display:none}.lightbox{padding:0;max-width:96vw;max-height:96dvh;width:max-content;border:1px solid #7b8c7e;border-radius:8px;background:#1d2822;color:#f9f4e7}.lightbox::backdrop{background:#13201ce8}.zoom-toolbar{position:sticky;top:0;display:flex;align-items:center;gap:14px;background:#24392f;padding:9px 14px;z-index:2;font-size:13px}.zoom-toolbar span{margin-right:auto}.zoom-toolbar button{background:#eef1e6;color:#263b2e;border:0;border-radius:4px;padding:6px 12px}.zoom-body{overflow:auto;max-height:calc(96dvh - 55px)}.zoom-body img{display:block;max-width:92vw;max-height:calc(94dvh - 60px);object-fit:contain}.zoom-body.original img{max-width:none;max-height:none}.skip{position:absolute;left:0;top:-100px;background:#fff;padding:10px;z-index:5}.skip:focus{top:0}.empty-main{padding:60px 0;font-size:20px}.meta{font-size:12px}.small-button{background:transparent;color:var(--red);border:0;padding:0}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.sync-banner{margin:0;padding:10px 30px;background:#f4e5cd;color:#75452c;font-size:13px}.sync-banner a{color:inherit}.sync-state{margin-top:14px;font-size:12px;color:var(--muted)}.sync-state summary{cursor:pointer}.sync-state ul{padding-left:20px}.sync-state code{overflow-wrap:anywhere}.sync-source{display:flex;flex-wrap:wrap;gap:6px 14px}.sync-warning{border-color:#b76736}.nav-pending{font-size:10px;color:#9e402d;margin-left:6px}
@media(min-width:1700px){.image-button img{max-height:69vh}}
@media(max-width:900px){.top{padding:12px 18px;gap:12px}.brand{font-size:17px;letter-spacing:1px}.brand small{font-size:10px}.workspace{grid-template-columns:220px minmax(0,1fr)}.sidebar{padding:16px 9px}.sidebar summary{font-size:13px}main{padding:22px 18px}h1{font-size:24px}.steps{gap:8px 12px}.steps li{font-size:13px}.figure figcaption small{display:none}.shot{flex-basis:120px}.shot img{width:110px;height:66px}}
@media(max-width:650px){.top{flex-wrap:wrap}.brand{width:100%;display:flex;justify-content:space-between;align-items:center}.brand small{display:inline}.search{width:100%;margin:0}.workspace{display:block}.sidebar{display:none}.mobile-nav{display:block;background:#e9ece0;padding:12px 16px}.mobile-nav select{width:100%;background:#fffef9;color:var(--ink);padding:10px;border:1px solid #bbc3b5;border-radius:5px}main{padding:21px 16px}.counter{display:none}.image-button img{max-height:none}.steps{display:grid;gap:9px}h1{font-size:24px;margin-bottom:18px}.figure figcaption{font-size:12px;padding:8px 10px}.flow-nav button{font-size:12px;padding:8px 10px}.zoom-toolbar{flex-wrap:wrap}.zoom-toolbar span{flex:1 1 100%}}
@media print{.top,.sidebar,.mobile-nav,.search,.shots,.flow-nav,.about{display:none}.workspace{display:block}main{padding:0}.figure{box-shadow:none}.image-button img{max-height:65vh}.steps{display:flex}body{background:white}}
</style>
<a class="skip" href="#content">跳到操作步骤</a>
<header class="top"><div class="brand">三国 · 操作手册<small id="manual-count"></small></div><div class="search"><label class="sr" for="search">查找操作</label><input id="search" type="search" placeholder="查找操作，如：出征、预算、存档" autocomplete="off"><button id="clear-search" aria-label="清空搜索" hidden>×</button></div></header>
<p id="sync-banner" class="sync-banner" hidden></p>
<div class="workspace"><nav class="sidebar" aria-label="操作目录"><div class="nav-heading"><span>操作目录</span><span id="match-count"></span></div><div id="navigation"></div></nav><div class="mobile-nav"><label class="sr" for="mobile-select">选择操作</label><select id="mobile-select"></select></div><main id="content" tabindex="-1"><div id="action-content"></div><details class="about"><summary>关于本手册</summary><p>截图为隔离演示存档中的实际游戏页面。少数场景使用受控资源、充能、伤亡或最终归属展示操作，不代表自然战果。每项只列操作步骤；相同页面的相关操作共用截图。手机游戏画面采用横屏。</p><p id="capture-meta"></p><p><a href="玩家行动交互流程.md">完整流程与生效边界</a> · <a href="images/player-actions/captures.json">截图来源记录</a> · <a href="manual/coverage.json">覆盖清单</a></p></details><details id="maintenance" class="sync-state"><summary id="sync-summary">手册与代码关联</summary><p>状态来自最近一次生成；静态文件不会自行读取源码。运行检查或启用监听后刷新页面。</p><p id="sync-overview"></p><ul id="sync-pending"></ul><div id="sync-current"></div></details></main></div>
<dialog class="lightbox" id="lightbox" aria-labelledby="zoom-title"><div class="zoom-toolbar"><span id="zoom-title"></span><button id="zoom-size">原始尺寸</button><button id="zoom-close">关闭 · Esc</button></div><div class="zoom-body" id="zoom-body"><img id="zoom-image" alt=""></div></dialog>
<script>
const manual=/*__MANUAL_DATA__*/;
const all=manual.chapters.flatMap((chapter,index)=>chapter.actions.map(a=>({...a,chapter:chapter.name,chapterIndex:index}))),byId=new Map(all.map(a=>[a.id,a]));
let selected=byId.has(location.hash.slice(1))?location.hash.slice(1):all.find(a=>a.name==='开始普通模式').id,shotIndex=0,query='';
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const matches=a=>!query||(a.name+' '+a.chapter+' '+a.steps.join(' ')).toLowerCase().includes(query);
const syncById=new Map(manual.maintenance.items.map(item=>[item.id,item]));
const pending=manual.maintenance.items.filter(item=>item.pending);
$('sync-summary').textContent='手册与代码关联 · '+(pending.length?pending.length+' 项待核对':'已核对');
$('sync-overview').textContent='检查：npm run docs:manual:check；监听：npm run docs:manual:watch。';
$('sync-pending').innerHTML=pending.map(item=>`<li><a href="#${item.id}">${esc(item.name)}</a> · ${esc(item.reasons.join('；'))}</li>`).join('');
if(pending.length){$('sync-banner').hidden=false;$('sync-banner').innerHTML=`有 ${pending.length} 项操作需要核对步骤或截图。<a href="#maintenance" id="show-maintenance">查看待更新项</a>`;}
document.addEventListener('click',e=>{if(e.target.id==='show-maintenance'){$('maintenance').open=true;}});
const active=()=>byId.get(selected),shot=()=>manual.captures[active().images[shotIndex]];
$('manual-count').textContent=all.length+' 项操作 · '+manual.date;
function renderNav(){
 const list=all.filter(matches);$('match-count').textContent=query?list.length+' 项':'';$('clear-search').hidden=!query;
 $('navigation').innerHTML=manual.chapters.map((c,i)=>{const rows=list.filter(a=>a.chapter===c.name);return !rows.length?'':`<details ${query||active().chapterIndex===i?'open':''}><summary>${esc(c.name)}<small>${rows.length}</small></summary>${rows.map(a=>`<button class="nav-action" data-id="${a.id}" ${a.id===selected?'aria-current="page"':''}>${esc(a.name)}${syncById.get(a.id).pending?'<span class="nav-pending">待核对</span>':''}</button>`).join('')}</details>`;}).join('')||'<p class="nav-empty">没有找到操作。试试“出征”或“存档”。</p>';
 $('mobile-select').innerHTML=list.length?manual.chapters.map(c=>{const rows=list.filter(a=>a.chapter===c.name);return rows.length?`<optgroup label="${esc(c.name)}">${rows.map(a=>`<option value="${a.id}" ${a.id===selected?'selected':''}>${esc(a.name)}</option>`).join('')}</optgroup>`:'';}).join(''):'<option>没有匹配的操作</option>';
}
function renderAction(){
 const a=active(),list=all.filter(matches),position=list.findIndex(x=>x.id===selected),sync=syncById.get(a.id);
 $('sync-current').innerHTML=`<p>${esc(a.name)} · ${sync.pending?'待核对步骤与截图':'已核对'}${sync.reviewedAt?' · '+esc(sync.reviewedAt.slice(0,10)):''}</p>${sync.changes.length?`<p>变化文件：<code>${esc(sync.changes.join('、'))}</code></p>`:''}<details><summary>关联代码与重拍入口</summary><p>公共或未分类的运行代码变动按全册复核。</p><div class="sync-source">${sync.sources.map(path=>`<a href="../${esc(path)}">${esc(path)}</a>`).join('')}</div><p>${sync.captureGroups.map(group=>`<code>node scripts/capture-action-guide.mjs ${esc(group)}</code>`).join('<br>')}</p></details>`;
 if(query&&!list.length){$('action-content').innerHTML='<p class="empty-main">没有匹配的操作</p>';$('capture-meta').textContent='';return;}
 $('action-content').innerHTML=`<div class="crumb">${esc(a.chapter)}</div><div class="title-row"><h1>${esc(a.name)}</h1><span class="counter">${all.indexOf(a)+1} / ${all.length}</span></div>${sync.pending?'<p class="note sync-warning">此操作的步骤与截图待核对。</p>':''}<ol class="steps">${a.steps.map(step=>`<li>${esc(step)}</li>`).join('')}</ol>${a.note?`<p class="note">${esc(a.note)}</p>`:''}<figure class="figure"><button class="image-button" id="open-image" aria-label="放大截图"><img id="main-image" alt="" decoding="async"></button><figcaption><span id="image-caption"></span><small>点击放大 · ← → 切换截图</small></figcaption></figure><div class="shots" aria-label="关键步骤截图">${a.images.map((id,i)=>`<button class="shot" data-shot="${i}" aria-pressed="${i===shotIndex}" aria-label="截图 ${i+1}：${esc(manual.captures[id].title)}"><img src="${esc(manual.captures[id].file)}" alt="" loading="lazy"><span>${i+1}. ${esc(manual.captures[id].title)}</span></button>`).join('')}</div><div class="flow-nav"><button data-flow="-1" ${position<=0?'disabled':''}>← ${position>0?esc(list[position-1].name):'第一项'}</button><button data-flow="1" ${position<0||position===list.length-1?'disabled':''}>${position>=0&&position<list.length-1?esc(list[position+1].name):'最后一项'} →</button></div>`;
 renderShot();
}
function renderShot(){const s=shot();$('main-image').src=s.file;$('main-image').alt=s.title;$('image-caption').textContent=(shotIndex+1)+' / '+active().images.length+' · '+s.title;document.querySelectorAll('[data-shot]').forEach(el=>el.setAttribute('aria-pressed',String(Number(el.dataset.shot)===shotIndex)));$('capture-meta').textContent=s.sample+'；'+s.viewport.width+' × '+s.viewport.height+'；截图日期 '+s.capturedAt.slice(0,10)+'。';}
function choose(id,focus=false){if(!byId.has(id))return;selected=id;shotIndex=0;history.replaceState(null,'','#'+id);renderNav();renderAction();if(focus){$('content').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}}
document.addEventListener('click',e=>{const target=e.target.closest('button');if(!target)return;if(target.dataset.id)choose(target.dataset.id,true);if(target.dataset.shot!==undefined){shotIndex=Number(target.dataset.shot);renderShot();}if(target.dataset.flow){const list=all.filter(matches),i=list.findIndex(a=>a.id===selected)+Number(target.dataset.flow);if(list[i])choose(list[i].id,true);}if(target.id==='open-image'){const s=shot();$('zoom-image').src=s.file;$('zoom-image').alt=s.title;$('zoom-title').textContent=s.title;$('zoom-body').classList.remove('original');$('zoom-size').textContent='原始尺寸';$('lightbox').showModal();}if(target.id==='zoom-close')$('lightbox').close();if(target.id==='zoom-size'){$('zoom-body').classList.toggle('original');target.textContent=$('zoom-body').classList.contains('original')?'适合窗口':'原始尺寸';}});
$('search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();const list=all.filter(matches);if(list.length&&!list.some(a=>a.id===selected)){selected=list[0].id;shotIndex=0;}renderNav();renderAction();});
$('clear-search').addEventListener('click',()=>{$('search').value='';$('search').dispatchEvent(new Event('input'));$('search').focus();});
$('mobile-select').addEventListener('change',e=>choose(e.target.value,true));
window.addEventListener('hashchange',()=>choose(location.hash.slice(1)));
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)||$('lightbox').open||!$('main-image'))return;if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();shotIndex=(shotIndex+(e.key==='ArrowRight'?1:-1)+active().images.length)%active().images.length;renderShot();}});
$('lightbox').addEventListener('click',e=>{if(e.target===$('lightbox'))$('lightbox').close();});
renderNav();renderAction();
</script>
</html>
